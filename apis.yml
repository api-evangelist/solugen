name: Solugen
description: 'Solugen is a chemical manufacturing company that produces sustainable
  industrial chemicals through its proprietary Bioforge platform, which combines engineered
  enzymes, metal catalysis, and modular process design to convert renewable feedstocks
  into products with minimal waste. Solugen serves markets including oil and gas, renewable
  fuels, aerospace and defense, water treatment, cleaning, agriculture, concrete, and
  personal care. Backed by Founders Fund, the company was added to the API Evangelist
  network as a portfolio lead; as of this enrichment pass Solugen publishes no public
  API, developer portal, SDK, or machine-readable developer surface.'
